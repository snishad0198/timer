<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4"/>

  <!-- Mechanical Card container with blue border highlight -->
  <rect x="48" y="48" width="416" height="416" rx="32" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="4" filter="url(#glow)"/>

  <!-- Digits "12" -->
  <text x="50%" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="240" font-weight="800" fill="#f4f4f5" text-anchor="middle" letter-spacing="-4">12</text>

  <!-- Split Flap Divider Groove -->
  <rect x="48" y="253" width="416" height="6" fill="#09090b"/>
  <!-- Top lip shadow -->
  <line x1="52" y1="253" x2="460" y2="253" stroke="#000000" stroke-width="2" opacity="0.8"/>
  <!-- Bottom lip highlight -->
  <line x1="52" y1="260" x2="460" y2="260" stroke="#ffffff" stroke-width="1.5" opacity="0.15"/>

  <!-- Mechanical Side Hinges -->
  <rect x="44" y="246" width="14" height="20" rx="3" fill="#64748b"/>
  <rect x="454" y="246" width="14" height="20" rx="3" fill="#64748b"/>

  <!-- Live Accent Indicator Dot -->
  <circle cx="416" cy="96" r="14" fill="#3b82f6"/>
  <circle cx="416" cy="96" r="6" fill="#bfdbfe"/>
</svg>
